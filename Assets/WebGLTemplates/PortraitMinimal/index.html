<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #182323; }
    #unity-container { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: #182323; }
    #game-frame { position: relative; background: #cfe5e1; }
    #unity-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center;
      color: #2a2e2a; font: 16px system-ui, sans-serif; background: #cfe5e1; }
    #loading[hidden], #error[hidden] { display: none; }
    progress { width: 170px; height: 6px; accent-color: #78a84d; }
    #error { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px;
      background: #f6f2e5; color: #2a2e2a; white-space: pre-wrap; overflow-wrap: anywhere; font: 15px system-ui, sans-serif; }
    #fullscreen { position: absolute; z-index: 2; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
      width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid #64736e; border-radius: 5px;
      color: #2a2e2a; background: #f6f2e5e6; cursor: pointer; opacity: .75; }
    #fullscreen:hover, #fullscreen:focus-visible { opacity: 1; outline: 2px solid #78a84d; }
    #fullscreen[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="unity-container">
    <div id="game-frame">
      <canvas id="unity-canvas" width="1080" height="1920" tabindex="0" aria-label="Don't Pop It game"></canvas>
      <div id="loading" role="status">Loading…<progress id="progress" max="1" value="0"></progress></div>
      <div id="error" role="alert" hidden></div>
    </div>
    <button id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 2H2v4m10-4h4v4M2 12v4h4m10-4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </main>
  <script>
    const container = document.getElementById("unity-container");
    const frame = document.getElementById("game-frame");
    const canvas = document.getElementById("unity-canvas");
    const fullscreen = document.getElementById("fullscreen");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    function resizeGame() {
      const padding = getComputedStyle(container);
      const width = container.clientWidth - parseFloat(padding.paddingLeft) - parseFloat(padding.paddingRight);
      const height = container.clientHeight - parseFloat(padding.paddingTop) - parseFloat(padding.paddingBottom);
      const gameHeight = Math.max(1, Math.min(height, width * 16 / 9));
      const gameWidth = gameHeight * 9 / 16;
      frame.style.width = gameWidth + "px";
      frame.style.height = gameHeight + "px";
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 1920 / gameHeight);
      const renderWidth = Math.max(1, Math.round(gameWidth * pixelRatio));
      const renderHeight = Math.max(1, Math.round(gameHeight * pixelRatio));
      if (canvas.width !== renderWidth) canvas.width = renderWidth;
      if (canvas.height !== renderHeight) canvas.height = renderHeight;
    }
    resizeGame();
    new ResizeObserver(resizeGame).observe(container);
    window.addEventListener("resize", resizeGame);
    window.visualViewport?.addEventListener("resize", resizeGame);
    canvas.addEventListener("contextmenu", event => event.preventDefault());
    canvas.addEventListener("wheel", event => event.preventDefault(), { passive: false });
    canvas.addEventListener("pointerdown", () => canvas.focus({ preventScroll: true }));

    const currentFullscreen = () => document.fullscreenElement || document.webkitFullscreenElement;
    fullscreen.hidden = !(container.requestFullscreen || container.webkitRequestFullscreen);
    fullscreen.addEventListener("click", () => {
      const action = currentFullscreen()
        ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
        : (container.requestFullscreen || container.webkitRequestFullscreen).call(container);
      Promise.resolve(action).catch(() => { fullscreen.title = "Use the itch.io fullscreen button"; });
    });
    function fullscreenChanged() {
      fullscreen.setAttribute("aria-label", currentFullscreen() ? "Exit fullscreen" : "Enter fullscreen");
      resizeGame();
    }
    document.addEventListener("fullscreenchange", fullscreenChanged);
    document.addEventListener("webkitfullscreenchange", fullscreenChanged);

    function showError(message) {
      loading.hidden = true;
      error.textContent = "The game could not start. Please reload the page.\n\n" + message;
      error.hidden = false;
    }
  </script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/" + {{{ JSON.stringify(DATA_FILENAME) }}},
      frameworkUrl: "Build/" + {{{ JSON.stringify(FRAMEWORK_FILENAME) }}},
#if USE_WASM
      codeUrl: "Build/" + {{{ JSON.stringify(CODE_FILENAME) }}},
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/" + {{{ JSON.stringify(SYMBOLS_FILENAME) }}},
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: false,
      devicePixelRatio: 1,
      showBanner: (message, type) => { if (type === "error") showError(message); else console.warn(message); }
    }, progress => { document.getElementById("progress").value = progress; }).then(instance => {
      window.unityInstance = instance;
      loading.hidden = true;
      resizeGame();
    }).catch(showError);
  </script>
</body>
</html>
